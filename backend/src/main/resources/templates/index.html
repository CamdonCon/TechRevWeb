<!DOCTYPE html>
<html lang="en">
<head>
  <title>Seattle Tech Revive</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- NAV -->
<nav id="navbar" aria-label="Main Navigation">
  <div class="nav-inner">
    <div class="nav-row">
      <div class="nav-links">
        <a href="#home">HOME</a>
        <a href="#products">PRODUCTS</a>
        <a href="#services">SERVICES</a>
      </div>
      <div class="menu-icon" id="menuBtn" aria-label="Menu Button" role="button" tabindex="0">
        <div class="bar top-bar"></div>
        <div class="bar bottom-bar"></div>
      </div>
    </div>
  </div>
</nav>

<!-- SECTIONS -->
<section id="home" class="about">
  <h1>Seattle Tech Revive</h1>
  <p>We sell refurbs and offer affordable device repairs with quality support.</p>
</section>

<section id="services">
  <div class="service-text">
    <h2>Need it fixed? Get a quote:</h2>
  </div>

  <div class="quote-form">
    <form action="/quote/submit" method="post" enctype="multipart/form-data">
      <label for="deviceType">Device Type:</label>
      <select name="deviceType" id="deviceType" required onchange="updateBrands()">
        <option value="">-- Select Device Type --</option>
        <option value="Laptop">Laptop</option>
        <option value="Desktop">Desktop</option>
        <option value="Phone">Phone</option>
        <option value="Tablet">Tablet</option>
        <option value="Monitor">Monitor</option>
        <option value="Gaming Console">Gaming Console</option>
        <option value="Controller">Controller</option>
        <option value="Other">Other</option>
      </select>

      <label for="brand">Brand:</label>
      <select name="brand" id="brand" required>
        <option value="">-- Select Brand --</option>
      </select>

      <label for="model">Model:</label>
      <input type="text" name="model" placeholder="e.g., iPhone 12" required>

      <label for="issue">Issue:</label>
      <textarea name="issue" rows="4" placeholder="Describe the problem..." required></textarea>

      <label for="image">Upload Image:</label>
      <input type="file" name="image" accept="image/*">

      <div style="text-align: right;">
        <button type="submit">Submit</button>
      </div>
    </form>
  </div>
</section>

<section id="products">
  <div class="product-text">
    <h2>Refurbished Products</h2>
    <p>All of these products have been stress tested before listing.</p>
  </div>

  <div th:each="product : ${products}">
    <div class="product-card">
      <h3 th:text="${product.name}">Product Name</h3>
      <p th:text="${product.description}">Short description</p>
      <p th:text="'$' + ${product.price}">Price</p>
      <img th:src="@{${product.imageUrl}}" th:alt="${product.name}" alt="Product Image"
           style="width:100%; height:200px; object-fit:cover; border-radius:6px;">
    </div>
  </div>
</section>

<!-- SCRIPTS -->
<script>
  const menuBtn = document.getElementById('menuBtn');
  const navbar = document.getElementById('navbar');
  menuBtn.addEventListener('click', () => {
    menuBtn.classList.toggle('open');
    navbar.classList.toggle('open');
  });

  const brandOptions = {
    Laptop: ["Apple", "Dell", "HP", "Lenovo", "Asus", "Acer", "Razer", "Microsoft", "Other"],
    Desktop: ["Dell", "HP", "Lenovo", "Asus", "Acer", "Other"],
    Phone: ["Apple", "Samsung", "Google", "OnePlus", "Other"],
    Tablet: ["Apple", "Samsung", "Microsoft", "Other"],
    Monitor: ["Dell", "LG", "Samsung", "Asus", "Other"],
    "Gaming Console": ["Nintendo", "Sony", "Xbox", "Other"],
    Controller: ["Nintendo", "Sony", "Xbox", "Other"],
    Other: ["Other"]
  };

  function updateBrands() {
    const deviceType = document.getElementById("deviceType").value;
    const brandSelect = document.getElementById("brand");
    brandSelect.innerHTML = '<option value="">-- Select Brand --</option>';
    if (deviceType && brandOptions[deviceType]) {
      brandOptions[deviceType].forEach(brand => {
        const option = document.createElement("option");
        option.value = brand;
        option.textContent = brand;
        brandSelect.appendChild(option);
      });
    }
  }

  // Single IntersectionObserver for all animated elements
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      } else {
        entry.target.classList.remove('visible');
      }
    });
  }, { threshold: 0.5 });

  document.querySelectorAll('.service-text, .quote-form, .product-text, .product-card')
    .forEach(el => observer.observe(el));

  // Highlight nav link on scroll
  const navLinks = document.querySelectorAll('nav a');
  window.addEventListener('scroll', () => {
    let current = '';
    document.querySelectorAll('section').forEach(section => {
      const sectionTop = section.offsetTop - 100;
      if (window.scrollY >= sectionTop) current = section.getAttribute('id');
    });
    navLinks.forEach(link => {
      link.classList.remove('active');
      if (link.getAttribute('href') === '#' + current) link.classList.add('active');
    });
  });
</script>

</body>
</html>
